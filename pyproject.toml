[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chwezi-document-suite"
dynamic = ["version"]
description = "Privacy-first local document conversion and management tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Peter Bamuhigire" }]
keywords = ["documents", "pdf", "markdown", "conversion"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "pypdf>=6.13.3,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
extract = [
  "pdfplumber>=0.11,<1",
  "python-pptx>=1,<2",
]
sign = [
  "pillow>=12.3,<13",
  "reportlab>=4,<6",
]
watch = ["watchdog>=4,<7"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
desktop = ["PySide6>=6.8,<7"]
ocr = ["ocrmypdf>=17,<18"]
office = ["pywin32>=306; sys_platform == 'win32'"]
ai = [
  "anthropic>=0.40,<2",
  "google-genai>=1.0,<3",
  "openai>=1,<3",
]
suite = [
  "anthropic>=0.40,<2",
  "customtkinter>=5.2,<6",
  "flask>=3,<4",
  "flask-cors>=4,<7",
  "google-genai>=1,<3",
  "openai>=1,<3",
  "pdfplumber>=0.11,<1",
  "pillow>=12.3,<13",
  "python-pptx>=1,<2",
  "reportlab>=4,<6",
  "watchdog>=4,<7",
]
test = [
  "hypothesis>=6,<7",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]
dev = [
  "build>=1,<2",
  "hatchling>=1.27,<2",
  "hypothesis>=6,<7",
  "mypy>=1.13,<3",
  "pip-audit>=2.7,<3",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.9,<1",
  "twine>=5,<7",
]
all = [
  "anthropic>=0.40,<2",
  "fastapi>=0.115,<1",
  "google-genai>=1.0,<3",
  "ocrmypdf>=17,<18",
  "openai>=1,<3",
  "pdfplumber>=0.11,<1",
  "pillow>=12.3,<13",
  "PySide6>=6.8,<7",
  "python-pptx>=1,<2",
  "reportlab>=4,<6",
  "uvicorn>=0.30,<1",
  "watchdog>=4,<7",
  "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
desktop-build = [
  "pyinstaller>=6.21,<7",
]

[project.scripts]
chwezi = "chwezi_docs.interfaces.cli.main:app"

[project.urls]
Repository = "https://github.com/peterbamuhigire/Chwezi-PDF-Suite"
Issues = "https://github.com/peterbamuhigire/Chwezi-PDF-Suite/issues"

[tool.hatch.version]
path = "src/chwezi_docs/version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/pyproject.toml",
  "/documents_to_markdown.py",
  "/window_geometry.py",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chwezi_docs"]

[tool.hatch.build.targets.wheel.force-include]
"documents_to_markdown.py" = "documents_to_markdown.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--strict-config --strict-markers"
markers = [
  "integration: exercises installed parsers or external boundaries",
  "security: exercises malicious or unsafe input handling",
]

[tool.coverage.run]
branch = true
source = ["chwezi_docs"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105"]
"sign_setup.py" = ["E501"]
"watch_setup.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["chwezi_docs"]
